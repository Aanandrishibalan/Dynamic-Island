<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline'">
<title>Dynamic Island Settings</title>
<style>
:root{--bg:#161618;--side:#1c1c1e;--card:#242426;--ink:#f5f5f7;--dim:#8e8e93;--line:#38383a;--on:#0a84ff}
:root[data-theme=light]{--bg:#f2f2f7;--side:#e5e5ea;--card:#fff;--ink:#1d1d1f;--dim:#6e6e73;--line:#d1d1d6}
:root{color-scheme:dark}:root[data-theme=light]{color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{display:flex;background:var(--bg);color:var(--ink);font:14px "Segoe UI Variable","Segoe UI",system-ui,sans-serif}
nav{width:200px;background:var(--side);padding:20px 12px;display:flex;flex-direction:column;gap:4px;flex:none}
nav h1{font-size:15px;margin:0 8px 14px}
nav button{text-align:left;background:none;border:0;color:var(--ink);padding:9px 12px;border-radius:10px;font:inherit;cursor:pointer}
nav button.on{background:var(--on);color:#fff}
main{flex:1;overflow-y:auto;padding:26px 32px}
main h2{margin:0 0 18px;font-size:20px}
.card{background:var(--card);border-radius:14px;padding:4px 16px;margin-bottom:14px}
.r{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:13px 0;border-bottom:1px solid var(--line)}
.r:last-child{border:0}
.r small,summary small{display:block;color:var(--dim);font-size:12px;margin-top:2px}
input,select,textarea{background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font:inherit;min-width:0}
select{cursor:pointer;max-width:300px;text-overflow:ellipsis}
select option,select optgroup{background:var(--card);color:var(--ink)}
select option:checked{background:var(--on);color:#fff}
select option:disabled{color:var(--dim)}
input[type=text],input:not([type]){width:240px}
input[type=checkbox]{width:18px;height:18px;flex:none;accent-color:var(--on)}
input[type=color]{padding:0;width:44px;height:30px}
textarea{width:100%;min-height:90px;resize:vertical}
button.b{background:var(--on);color:#fff;border:0;border-radius:8px;padding:7px 14px;font:inherit;cursor:pointer}
button.b.g{background:var(--line);color:var(--ink)}
button.b.d{background:#5a1a17;color:#ff6961}
details{border-bottom:1px solid var(--line);padding:12px 0}details:last-child{border:0}
summary{cursor:pointer}summary b{font-weight:600}
.tx{margin:10px 0;display:flex;flex-direction:column;gap:6px;user-select:text}
.tx p{margin:0;padding:8px 12px;border-radius:12px;background:var(--bg);white-space:pre-wrap}
.tx p b{display:block;font-size:11px;color:var(--dim);margin-bottom:2px}
.acts{display:flex;gap:8px}
.add{display:flex;gap:8px;margin-bottom:14px}.add input{flex:1;width:auto!important}
.t{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}.t:last-child{border:0}
.t span{flex:1}.t.done span{text-decoration:line-through;color:var(--dim)}
.t button{background:none;border:0;color:var(--dim);cursor:pointer;font-size:16px}
.empty{color:var(--dim);padding:16px 0}
kbd{background:var(--bg);border:1px solid var(--line);border-bottom-width:2px;border-radius:6px;padding:2px 7px;font:12px "Segoe UI",system-ui,sans-serif;white-space:nowrap}
.dt{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;vertical-align:middle}
.sec{font-size:12px;color:var(--dim);margin:20px 4px 8px;text-transform:uppercase;letter-spacing:.4px}
.note{color:var(--dim);font-size:12.5px;line-height:1.5;margin:0 4px 14px}
.acct{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
select:disabled,input:disabled{opacity:.5}
.mrow{cursor:grab}.mrow.drag{opacity:.4}.mrow.over{box-shadow:0 -2px 0 var(--on)}.grip{color:var(--dim);font-size:18px;line-height:1}
.mv{display:flex;gap:4px}.mv .b{padding:3px 9px;font-size:11px}.mv .b:disabled{opacity:.3;cursor:default}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,summary:focus-visible{outline:2px solid var(--on);outline-offset:2px}
</style>
</head>
<body>
<nav id="nav"></nav><main id="main"></main>
<script>
(function(){
  let toolsMsg='',ocrLangs=null,expSt=null,locMsg=null,db={settings:{},conversations:[],tasks:[]},tab=(location.hash||'').slice(1)||'general',mail={status:{},messages:[]},aiSt=null,aiModels={claude:[],openai:[]},aiMsg={},vSt=null,vMsg=null;
  const $=s=>document.querySelector(s),root=document.documentElement;
  const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const NEWS=[['BBC News','https://feeds.bbci.co.uk/news/rss.xml'],['The Hindu (National)','https://www.thehindu.com/news/national/feeder/default.rss'],['Times of India','https://timesofindia.indiatimes.com/rssfeedstopstories.cms'],['NDTV','https://feeds.feedburner.com/ndtvnews-top-stories']];
  const TABS={general:'General',menus:'Menus',tools:'Tools',ai:'AI & chat',assistant:'Assistant',wellness:'Wellness & alerts',security:'Security',messages:'Messages',history:'Chat history',about:'About'};
  if(!(tab in TABS))tab='general';
  const mq=matchMedia('(prefers-color-scheme: dark)');
  const row=(l,h,c)=>`<div class="r"><div>${l}${h?`<small>${h}</small>`:''}</div>${c}</div>`;
  const chk=k=>`<input type="checkbox" data-set="${k}" ${db.settings[k]!==false&&db.settings[k]?'checked':''}>`;
  const txt=(k,w)=>`<input data-set="${k}" value="${esc(db.settings[k]||'')}">`;

  const SL0=[['assistant','Assistant','Daily briefing, voice commands, summaries, writing help, meeting notes'],['planner','Planner','Today\'s plan, Quick Capture, categories, priorities, repeating tasks, Eisenhower matrix'],['habits','Habits','Daily habits with streaks'],['goals','Daily goals','Daily targets such as 8 glasses of water'],['journal','Journal','Daily notes, mood and captured ideas'],['expenses','Expenses','Daily spending, totals and categories'],['music','Music','Now playing, previous / play-pause / next, volume'],['tasks','Tasks & reminders','Tasks with optional reminder times'],['calendar','Calendar','Month grid, events and reminders'],['clock','Timer & stopwatch','Countdown timer, stopwatch and laps'],['connect','Wi-Fi & Bluetooth','Switch radios, connect to networks'],['speed','Network speed','Live download / upload speed, ping, speed test and history'],['browser','Browser','Open a URL or search, quick links'],['pad','Sticky pad','Three notes'],['find','Find','Apps, open windows, files'],['photos','Photos','Your Pictures folder'],['weather','Weather','Forecast for your city'],['news','News','RSS headlines'],['health','Health & usage','Screen time, battery'],['system','System','CPU, memory, storage'],['style','Style','Theme, size and colour of the island'],['messages','Messages','Outlook, Gmail and WhatsApp'],['clipboard','Clipboard','Searchable history of what you copied, saved snippets, paste into any app'],['expander','Text expander','Type a short code such as ;sig and it becomes your full text'],['windows','Windows','Snap windows, side-by-side layouts, save and restore your window arrangement'],['launch','Quick launch','Favourite apps and folder shortcuts'],['rename','File renamer','Rename many files at once with a preview and undo'],['transfer','File transfer','Send files to and from your phone over Wi-Fi, no cable or cloud'],['ocr','Screenshot OCR','Drag around text on screen and copy it'],['calc','Calculator','Calculator, unit and currency converter, calculation history'],['qr','QR codes','Make QR codes for links, text and Wi-Fi'],['taskman','Task manager','Running apps with icons, tick the ones to end, or end one with a click'],['shopping','Shopping list','A real checklist: add by typing or by saying "add milk to the shopping list"'],['alarms','Alarms and clocks','Alarm clock, world clock, Pomodoro focus timer and countdowns']];
  const slOrder=s=>{const o=(Array.isArray(s.slideOrder)?s.slideOrder:[]).filter((id,i,a)=>a.indexOf(id)===i&&SL0.some(x=>x[0]===id));return [...o.map(id=>SL0.find(x=>x[0]===id)),...SL0.filter(x=>!o.includes(x[0]))]};
  const SLIDES=SL0;
  let APPVER='';
  const views={
    menus(s){const hid=Array.isArray(s.hiddenSlides)?s.hiddenSlides:[],n=SLIDES.filter(x=>!hid.includes(x[0])).length+1,ord=slOrder(s);
      return `<h2>Menus</h2><p class="note">Choose which slides appear when you swipe through the island, and in what order. Drag a row by its handle, or use the arrows. Unticked slides are removed from the swipe, the dots and the arrow keys, and Home buttons that lead to them are hidden. Home is always first and always shown. Changes apply immediately. <b>${n} of ${SLIDES.length+1}</b> shown.</p>
      <div class="card">`+row('<b>Home</b>','Always shown',`<input type="checkbox" checked disabled aria-label="Home (always shown)">`)+
      ord.map((x,i)=>`<div class="r mrow" draggable="true" data-mrow="${x[0]}"><span class="grip" aria-hidden="true">⠿</span><div style="flex:1">${esc(x[1])}<small>${esc(x[2])}</small></div><span class="mv"><button class="b g" data-click="menuup" data-id="${x[0]}" aria-label="Move ${esc(x[1])} earlier" ${i?'':'disabled'}>▲</button><button class="b g" data-click="menudown" data-id="${x[0]}" aria-label="Move ${esc(x[1])} later" ${i<ord.length-1?'':'disabled'}>▼</button></span><input type="checkbox" data-menu="${x[0]}" ${hid.includes(x[0])?'':'checked'} aria-label="Show ${esc(x[1])}"></div>`).join('')+`</div>
      <div class="acts"><button class="b g" data-click="menuorder">Reset order</button><button class="b g" data-click="menuall">Show all</button><button class="b g" data-click="menunone">Hide all except Home</button></div>`},
    general(s){return `<h2>General</h2><div class="card">`+
      row('Theme','Applies to the island and this window',`<select data-set="theme">${[['dark','Dark'],['light','Light'],['auto','Match Windows']].map(o=>`<option value="${o[0]}" ${s.theme===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`)+
      row('Accent colour','Toggles, chat bubbles and highlights',`<input type="color" data-set="accent" value="${s.accent}">`)+
      row('24-hour clock','',chk('clock24'))+
      row('Date format','How the date is shown on Home and in reminders',`<select data-set="dateFormat">${[['auto','Automatic (Fri, 20 Nov)'],['dmy','DD/MM/YYYY'],['mdy','MM/DD/YYYY'],['ymd','YYYY-MM-DD'],['long','Friday, 20 November 2026']].map(o=>`<option value="${o[0]}" ${(s.dateFormat||'auto')===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`)+
      row('Check internet connection','Tests the real connection every 10 seconds so the island shows Offline when the network is down. Contacts Windows\' own connectivity-test address (msftconnecttest.com); nothing is sent about you. Off: uses Windows\' own network flag only',chk('netProbe'))+
      row('Week starts on','Calendar slide',`<select data-set="weekStart">${[['auto','Automatic'],['sun','Sunday'],['mon','Monday']].map(o=>`<option value="${o[0]}" ${(s.weekStart||'auto')===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`)+
      row('Start with Windows','Launch the island when you sign in',chk('launchAtStartup'))+
      row('Hide in full screen','Hides the island while a full-screen app is in front (YouTube or Netflix in full screen, VLC, games, presentations) and brings it back when you leave full screen. The open shortcut still shows it. A video playing in a normal window is not hidden',chk('hideFullscreen'))+
      row('Open shortcut','Global. Example: Control+Alt+Space',txt('shortcut'))+
      row('Quick Capture shortcut','Global. Opens the planner with the cursor ready: type "Call supplier at 4 PM" and press Enter. Example: Control+Alt+N. Leave empty to turn it off',txt('captureShortcut'))+
      row('Currency symbol','Used in the Expenses slide',`<input data-set="currency" value="${esc(s.currency||'₹')}" maxlength="4" style="width:70px">`)+
      row('Search engine','Browser slide. Your query is added at the end',txt('searchEngine'))+
      `<div class="r" style="display:block"><div>Quick links<small>Browser slide. One per line: Name|https://address</small></div><textarea data-set="quickLinks" style="margin-top:10px">${esc(s.quickLinks||'')}</textarea></div>`+
      `<div class="r" style="display:block"><div>Location<small>Used for the weather. Type a city, or detect it from your internet connection (approximate, from your IP address). Empty = detect automatically each time</small></div><div class="add" style="margin:10px 0 0;flex-wrap:wrap;align-items:center">${txt('weatherCity')}<button class="b" data-click="locdetect">Detect my location</button>${s.weatherCity?'<button class="b g" data-click="locclear">Use automatic</button>':''}</div><small id="locMsg" style="color:${locMsg&&locMsg.ok?'#30d158':'var(--dim)'};display:block;margin-top:6px" aria-live="polite">${locMsg?esc(locMsg.t):(s.weatherCity?'Using: '+esc(s.weatherCity):'Automatic: detected from your connection')}</small></div>`+
      row('Temperature units','',`<select data-set="units"><option value="c" ${s.units!=='f'?'selected':''}>Celsius</option><option value="f" ${s.units==='f'?'selected':''}>Fahrenheit</option></select>`)+
      row('News source','Shown in the News slide',`<select data-set="newsFeed">${(NEWS.some(n=>n[1]===s.newsFeed)?NEWS:[...NEWS,['Custom feed',s.newsFeed]]).map(n=>`<option value="${esc(n[1])}" ${s.newsFeed===n[1]?'selected':''}>${esc(n[0])}</option>`).join('')}</select>`)+
      row('Photo folder','Leave empty to use your Pictures folder',txt('photoFolder'))+
      row('Screenshot mode','Without island: the island is hidden for the picture. Collapsed island: the small pill stays in the picture',`<select data-set="shotMode">${[['hidden','Without island'],['collapsed','Collapsed island']].map(o=>`<option value="${o[0]}" ${(s.shotMode==='collapsed'?'collapsed':'hidden')===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`)+
      row('Screenshot delay','Time to arrange the screen before the picture is taken',`<select data-set="shotDelay">${[[0,'None'],[3,'3 seconds'],[5,'5 seconds'],[10,'10 seconds']].map(o=>`<option value="${o[0]}" ${Number(s.shotDelay||0)===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`)+
      row('Capture folder','Where photos, videos, voice notes and screenshots are saved. Empty = Pictures, Videos and Music \\ Dynamic Island',txt('captureFolder'))+`</div>
      <div class="card">`+row('Quit Dynamic Island','Closes the island until you start it again',`<button class="b d" data-click="quit">Quit</button>`)+`</div>`},
    tools(s){
      const sel=(k,opts,cur)=>`<select data-set="${k}">${opts.map(o=>`<option value="${o[0]}" ${String(cur)===String(o[0])?'selected':''}>${o[1]}</option>`).join('')}</select>`;
      const langs=[['auto','Automatic (your Windows languages)'],...((ocrLangs||[]).map(l=>[l.tag,l.name]))];
      if(s.ocrLang&&!langs.some(l=>l[0]===s.ocrLang))langs.push([s.ocrLang,s.ocrLang]);
      const e=expSt||{};
      return `<h2>Tools</h2>`+(toolsMsg?`<p class="note" role="status">${esc(toolsMsg)}</p>`:'')+
      `<div class="sec">Clipboard</div><div class="card">`+
      row('Keep a clipboard history','Remembers text you copy so you can search it and paste it again. Text only, kept on this PC (clips.json), never sent anywhere. Items copied from password managers are skipped',chk('clipEnabled'))+
      row('Pause recording','Nothing new is recorded while this is on',chk('clipPaused'))+
      row('Items to keep','Saved (pinned) items never count toward the limit',sel('clipMax',[[50,'50'],[100,'100'],[200,'200'],[500,'500']],s.clipMax||200))+
      row('Delete older items after','Saved items are kept',sel('clipDays',[[0,'Never'],[1,'1 day'],[7,'7 days'],[30,'30 days'],[90,'90 days']],s.clipDays==null?30:s.clipDays))+
      row('Clear the history now','Saved items stay',`<button class="b d" data-click="clipclear">Clear history</button>`)+`</div>`+
      `<div class="sec">Text expander</div><div class="card">`+
      row('Turn on the text expander','Type a short code (for example ;sig) in any app and it is replaced by your text. This starts a small helper that watches the keys you type to spot your codes. It never records, stores or sends what you type. Some antivirus programs warn about any keyboard hook, so it is off until you switch it on. Add and edit snippets in the Text expander slide',chk('expanderOn'))+
      row('Status',e.supported===false?'Works on Windows only':'',`<span>${e.running?'<span style="color:#30d158">●</span> Running':(s.expanderOn?'<span style="color:#ff9f0a">●</span> '+esc(e.error||'Starting…'):'Off')}</span>`)+`</div>`+
      `<div class="sec">Screenshot OCR</div><div class="card">`+
      row('Shortcut','Global. Drag around text anywhere on screen to copy it. Example: Control+Alt+O. Leave empty to turn it off',txt('ocrShortcut'))+
      row('Language','Uses the text recognition built into Windows, offline. More languages: Windows Settings, Time &amp; language, Language &amp; region',sel('ocrLang',langs,s.ocrLang||'auto'))+
      row('Copy the text automatically','The recognised text is also placed on the clipboard',chk('ocrCopy'))+`</div>`+
      `<div class="sec">File transfer</div><div class="card">`+
      row('Receive folder','Where files sent from your phone are saved. Empty = Downloads \\ Dynamic Island',txt('receiveFolder'))+`</div>`+
      `<div class="sec">Calculator</div><div class="card">`+
      row('Online exchange rates','The currency converter downloads rates once a day from open.er-api.com (no account, nothing about you is sent). Off: only the last saved rates are used',chk('fxOnline'))+`</div>`},
    ai(s){
      const A=aiSt||{claude:false,openai:false,canStore:true,locked:false},cur=s.aiProvider||'ollama',blocked=A.locked||A.canStore===false;
      const PN={claude:'Claude (Anthropic)',openai:'ChatGPT (OpenAI)'},KN={claude:'Anthropic',openai:'OpenAI'};
      const provOpts=[['ollama','Local model (Ollama)'],['claude','Claude'],['openai','ChatGPT']].map(o=>{const off=o[0]!=='ollama'&&!A[o[0]];
        return `<option value="${o[0]}" ${cur===o[0]?'selected':''} ${off?'disabled':''}>${o[1]}${off?' (not connected)':''}</option>`}).join('');
      const acct=p=>{
        const on=!!A[p],ms=aiModels[p]||[],m=s[p+'Model']||'',msg=aiMsg[p];
        const list=ms.length?(ms.includes(m)?ms:[m,...ms].filter(Boolean)):[];
        const modelCtl=list.length?`<select data-set="${p}Model" aria-label="Model">${list.map(x=>`<option value="${esc(x)}" ${x===m?'selected':''}>${esc(x)}</option>`).join('')}</select>`:`<input data-set="${p}Model" value="${esc(m)}" aria-label="Model">`;
        return `<div class="r" style="display:block"><div class="acct"><div><b>${PN[p]}</b><small><span style="color:${on?'#30d158':'#8e8e93'}">●</span> ${on?'Connected':'Not connected'}</small></div>${on?`<span class="acts">${cur!==p?`<button class="b g" data-click="aiuse" data-id="${p}">Use for chat</button>`:''}<button class="b d" data-click="aidisc" data-id="${p}">Disconnect</button></span>`:''}</div>`+
          (on?`<div class="add" style="margin:10px 0 0;align-items:center"><span style="color:var(--dim);font-size:12px">Model</span>${modelCtl}</div>`:
            `<div class="add" style="margin:10px 0 0;flex-wrap:wrap"><input id="key-${p}" type="password" placeholder="Paste your ${KN[p]} API key" autocomplete="off" spellcheck="false" ${blocked?'disabled':''}><button class="b" data-click="aiconnect" data-id="${p}" ${blocked?'disabled':''}>Connect</button><button class="b g" data-click="aikey" data-id="${p}">Get a key</button></div>`)+
          `<small id="aimsg-${p}" style="color:${msg&&msg.ok?'#30d158':'var(--dim)'}" aria-live="polite">${msg?esc(msg.t):''}</small></div>`};
      return `<h2>AI &amp; chat</h2>
      <p class="note">Connect Claude or ChatGPT with an API key from your own account. A claude.ai or chatgpt.com subscription login can't be used by other apps, and API use is billed by Anthropic or OpenAI separately. Keys are stored in an encrypted vault on this PC (AES-256-GCM, optional passphrase; see Security) and are never shown again. When Claude or ChatGPT is selected, your chat messages, and any screenshot you ask about, are sent to that company.${A.locked?'<br><b>Your saved keys are locked.</b> <a href="#security">Unlock them in Security</a>.':A.canStore===false?'<br><b>Secure storage is not available on this PC.</b> <a href="#security">Set a passphrase in Security</a> to store keys.':''}</p>
      <div class="card">`+
      row('Chat with','Used for chat, voice questions and “explain this screen”',`<select data-set="aiProvider">${provOpts}</select>`)+
      acct('claude')+acct('openai')+
      row('Speech to text','Automatic uses OpenAI when ChatGPT is connected, otherwise Whisper on this PC (below)',`<select data-set="sttEngine">${[['auto','Automatic'],['openai','OpenAI'],['local','Whisper on this PC']].map(o=>`<option value="${o[0]}" ${(s.sttEngine||'auto')===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`)+`</div>
      <div class="sec">Local model (Ollama)</div><div class="card">`+
      row('Model','Run <b>ollama pull llama3.2:1b</b> once to install the default',`<span>${txt('model')} <button class="b g" data-click="resetmodel">Default</button></span>`)+
      row('Ollama address','',txt('ollamaUrl'))+`</div>
      <div class="sec">Chat</div><div class="card">`+
      `<div class="r" style="display:block"><div>System prompt<small>Sent at the start of every chat</small></div><textarea data-set="systemPrompt" style="margin-top:10px">${esc(s.systemPrompt||'')}</textarea></div>`+
      row('Read replies aloud','Uses Windows speech',chk('speakReplies'))+
      row('Save chat history','Stored only on this PC',chk('saveHistory'))+`</div>
      <div class="sec">Planner</div><div class="card">`+
      row('AI for Quick Capture','Dates, times, categories and priorities are always understood on this PC. This adds an AI pass for trickier wording. <b>Claude / ChatGPT only</b>: used when one of them is selected above, and then the text you capture is sent to that company. <b>Also the local model</b>: uses Ollama on this PC (slower).',`<select data-set="aiAssist">${[['cloud','Claude / ChatGPT only'],['always','Also the local model'],['off','Off']].map(o=>`<option value="${o[0]}" ${(s.aiAssist||'cloud')===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`)+`</div>
      <div class="sec">Vision and voice (local)</div><div class="card">`+
      row('Vision model','Reads your screen when the local model is selected. Run <b>ollama pull gemma3:4b</b> once',txt('visionModel'))+
      row('Whisper model file','File name inside the whisper folder (see whisper/README.txt)',txt('whisperModel'))+
      row('Speech language','Auto works with multilingual models only',`<select data-set="whisperLang">${[['auto','Auto-detect'],['en','English'],['ta','Tamil']].map(o=>`<option value="${o[0]}" ${s.whisperLang===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`)+`</div>`},
    wellness(s){
      const hm=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`,tm=(k,v)=>`<input type="time" data-time="${k}" value="${hm(v)}">`;
      const sel=(k,opts,cur)=>`<select data-set="${k}">${opts.map(o=>`<option value="${o[0]}" ${String(cur)===String(o[0])?'selected':''}>${o[1]}</option>`).join('')}</select>`;
      const num=(k,min,max,w)=>`<input type="number" data-set="${k}" min="${min}" max="${max}" value="${esc(s[k]==null?'':s[k])}" style="width:${w||80}px">`;
      const on=k=>`<input type="checkbox" data-set="${k}" ${s[k]?'checked':''}>`;
      return `<h2>Wellness &amp; alerts</h2><p class="note">Reminders that look after you. They work while the island is collapsed: a Windows notification appears and the island opens with a sound. Everything is worked out on this PC.</p>

    assistant(s){
      const mem=db.memory||[],mt=db.meetings||[],hm=m=>`${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`,eng={claude:'Claude',openai:'ChatGPT'}[s.aiProvider]||'the local model';

      return `<h2>Assistant</h2><p class="note">The Assistant slide answers “What's pending today?”, writes your daily briefing, finds free time for unfinished tasks, controls the island by voice, summarises and rewrites text, takes meeting notes and helps with your screen. Tasks, calendar, search and scheduling are worked out on this PC. Language work uses <b>${eng}</b> (Settings &gt; AI &amp; chat) and says so on every answer; without a reachable model, summaries and proofreading fall back to simple offline versions.</p>
      <div class="sec">Everyday</div><div class="card">`+
      row('Daily briefing','Opens the Assistant with your briefing the first time you open the island each day',`<select data-set="assistBrief">${[['first','First open of the day'],['off','Only when I ask']].map(o=>`<option value="${o[0]}" ${(s.assistBrief||'first')===o[0]?'selected':''}>${o[1]}</option>`).join('')}</select>`)+
      row('Contextual suggestions','Hints on Home and in the Assistant based on the app in front, the time, battery and your next event',chk('assistSuggest'))+
      row('Voice commands go to the Assistant','The Speak button and the voice shortcut open apps, set timers, add tasks, change volume and more. Turn off to keep Speak as plain chat',chk('assistVoiceRoute'))+
      row('Read answers aloud after voice commands','Uses Windows speech',chk('assistSpeak'))+
      row('Voice shortcut','Press from anywhere to speak a command (e.g. Control+Alt+V)',txt('voiceShortcut'))+`</div>
      <div class="sec">Smart scheduling</div><div class="card">`+
      row('Working hours','Free time is only suggested inside these hours. “Remember that I work 10 to 7” also sets them',`<span>${tm('assistWorkStart',s.assistWorkStart||540)} to ${tm('assistWorkEnd',s.assistWorkEnd||1080)}</span>`)+
      row('Keep lunch free','Around 1 PM, or the time you told the assistant to remember',chk('assistLunch'))+
      row('Default task length (minutes)','Used when a task has no length like “45 min”',`<input type="number" min="5" max="240" data-set="assistDefMin" value="${s.assistDefMin||30}" style="width:80px">`)+`</div>
      <div class="sec">Privacy</div><div class="card">`+
      row('Personal memory','Lets the assistant keep preferences and routines you approve. It never saves one without your yes',chk('assistMemory'))+
      row('Share tasks, calendar and memory with Claude / ChatGPT','Off by default. When off, only the text you ask about (a selection, a clipboard, a meeting, a screenshot) goes to a cloud model, and your plans stay on this PC. The local model always has the context',chk('assistCloudContext'))+`</div>
      <div class="sec">What I remember (${mem.length})</div><div class="card">`+
      (mem.length?mem.map(m=>`<div class="r"><div>${esc(m.text)}<small>${esc(m.kind)} · ${new Date(m.t).toLocaleDateString()}</small></div><button class="b d" data-click="memdel" data-id="${m.id}">Forget</button></div>`).join(''):`<div class="r"><div>Nothing yet<small>Say “remember that I prefer meetings after 11” or “I usually go to the gym at 6 PM”</small></div></div>`)+
      `<div class="r" style="display:block"><div class="add" style="margin:0"><input id="memNew" placeholder="Add something to remember, e.g. I work 10 am to 7 pm"><button class="b" data-click="memadd">Add</button>${mem.length?'<button class="b d" data-click="memclear">Forget all</button>':''}</div><small id="memMsg" style="color:var(--dim)"></small></div></div>
      <div class="sec">Meeting notes (${mt.length})</div>`+
      (mt.length?`<div class="card">${mt.map(m=>`<details class="conv"><summary><b>${esc(m.title)}</b> <small>${new Date(m.t).toLocaleString()}${m.dur?' · '+Math.max(1,Math.round(m.dur/60))+' min':''}</small></summary><p>${esc(m.summary)}</p>${m.decisions.length?'<b>Decisions</b><ul>'+m.decisions.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>':''}${m.actions.length?'<b>Action items</b><ul>'+m.actions.map(a=>`<li>${esc(a.text)}${a.owner?' ('+esc(a.owner)+')':''}${a.due?' - '+esc(a.due):''}</li>`).join('')+'</ul>':''}
        <div class="acts"><button class="b" data-click="mtexport" data-id="${m.id}">Export .md</button><button class="b g" data-click="mttasks" data-id="${m.id}">Add action items to planner</button><button class="b d" data-click="mtdel" data-id="${m.id}">Delete</button></div></details>`).join('')}</div>`:`<p class="empty">No meeting notes yet. Say “start meeting notes” in the island. Audio is never saved, only the notes you choose to keep.</p>`)},
    security(s){
      const V=vSt||{mode:'device',locked:false,canStore:true,dpapi:true,names:[],cipher:'AES-256-GCM',kdf:'',error:'',retryIn:0},pm=V.mode==='passphrase';
      const NM={claude:'Claude API key',openai:'ChatGPT API key',gmail:'Gmail app password'};
      const dot=(c,t)=>`<span><span style="color:${c}">●</span> ${t}</span>`;
      const msg=vMsg?`<small id="vmsg" style="color:${vMsg.ok?'#30d158':'#ff453a'}" aria-live="polite">${esc(vMsg.t)}</small>`:'<small id="vmsg" aria-live="polite"></small>';
      const pw=(id,ph)=>`<input id="${id}" type="password" placeholder="${ph}" autocomplete="off" spellcheck="false">`;
      let h=`<h2>Security</h2><p class="note">Your Claude and ChatGPT API keys and your Gmail app password are never saved in plain text. They are encrypted with <b>AES-256-GCM</b>, and the windows of the island never receive them: only the background process uses a key, at the moment it is needed.</p><div class="card">`+
        row('Encryption','Authenticated encryption, a fresh random IV on every save',`<b>${esc(V.cipher)}</b>`)+
        row('Key protection',pm?'The vault key is derived from your passphrase. Nothing on disk can open it without the passphrase':'The vault key is protected by your Windows account (DPAPI)',pm?`<span>Passphrase<br><small>${esc(V.kdf)}</small></span>`:(V.dpapi?'Windows account':dot('#ff453a','Unavailable')))+
        row('Vault',V.error?esc(V.error):(V.locked?'Locked: keys cannot be used until you unlock':'Open: keys can be used'),V.locked?dot('#ff9f0a','Locked'):dot('#30d158','Unlocked'))+
        row('Saved secrets','',V.locked?'<span style="color:var(--dim)">Hidden while locked</span>':(V.names.length?esc(V.names.map(n=>NM[n]||n).join(', ')):'<span style="color:var(--dim)">None yet</span>'))+`</div>`;
      if(V.error)h+=`<div class="card"><div class="r" style="display:block"><div>The vault cannot be opened<small>If you have no other way to open it, erase it below and add your keys again.</small></div></div></div>`;
      else if(pm&&V.locked)h+=`<div class="sec">Unlock</div><div class="card"><div class="r" style="display:block"><div>Enter your passphrase<small>Claude, ChatGPT and Gmail stay disconnected until you do</small></div><div class="add" style="margin:10px 0 0">${pw('vpUnlock','Passphrase')}<button class="b" data-click="vpunlock">Unlock</button></div>${msg}</div></div>`;
      else if(!pm)h+=`<div class="sec">Passphrase (recommended)</div><div class="card"><div class="r" style="display:block"><div>Protect your keys with a passphrase<small>Without one, any program running as you could ask Windows to open the vault. With one, nothing can, even if a copy of your files is stolen. It also lets the portable version carry your keys between PCs. You enter it after every restart, and whenever Windows locks or sleeps.</small></div>
        <div class="add" style="margin:10px 0 0;flex-wrap:wrap">${pw('vpNew','New passphrase (10+ characters)')}${pw('vpNew2','Repeat passphrase')}<button class="b" data-click="vpset">Protect with passphrase</button></div><small id="vpHint" style="color:var(--dim)">A few random words make a strong passphrase. It cannot be recovered: if you forget it, you can only erase the vault.</small>${msg}</div></div>`;
      else h+=`<div class="sec">Passphrase</div><div class="card">`+
        row('Lock now','Forget the keys in memory until you enter the passphrase again',`<button class="b g" data-click="vplock">Lock now</button>`)+
        row('Lock automatically','After this long without you using a key. Background mail checks do not count',`<select data-set="vaultAutoLock">${[[0,'Never'],[5,'5 minutes'],[15,'15 minutes'],[30,'30 minutes'],[60,'1 hour'],[240,'4 hours']].map(o=>`<option value="${o[0]}" ${String(s.vaultAutoLock==null?30:s.vaultAutoLock)===String(o[0])?'selected':''}>${o[1]}</option>`).join('')}</select>`)+
        row('Lock when Windows locks or sleeps','',chk('vaultLockOnScreen'))+
        `<div class="r" style="display:block"><div>Change passphrase<small>This also creates a new vault key and re-encrypts everything</small></div><div class="add" style="margin:10px 0 0;flex-wrap:wrap">${pw('vpOld','Current passphrase')}${pw('vpNew','New passphrase')}${pw('vpNew2','Repeat new passphrase')}<button class="b" data-click="vpset">Change</button></div><small id="vpHint" style="color:var(--dim)"></small>${msg}</div>
        <div class="r" style="display:block"><div>Remove passphrase<small>${V.dpapi?'Go back to protection by your Windows account':'Not possible on this PC: Windows secure storage is unavailable'}</small></div>${V.dpapi?`<div class="add" style="margin:10px 0 0">${pw('vpRm','Current passphrase')}<button class="b d" data-click="vprm">Remove</button></div>`:''}</div></div>`;
      h+=`<div class="sec">Erase</div><div class="card"><div class="r"><div>Erase all saved keys<small>Deletes the vault file (overwritten with zeros first) and disconnects Claude, ChatGPT and Gmail</small></div><button class="b d" data-click="vpwipe" id="vpwipe">Erase all keys</button></div></div>
      <p class="note" style="margin-top:14px">What this protects against: someone copying your files, other Windows users and (with a passphrase) other programs on your PC. What it cannot do: stop malware that already controls this app while the vault is unlocked, or protect a key you paste into a website. Chats, tasks and settings are not encrypted.</p>`;
      return h},
    messages(s){
      const st=k=>mail.status[k]||{state:'off',detail:'Off'},dot=k=>({ok:'#30d158',warn:'#ff9f0a',error:'#ff453a',off:'#8e8e93'}[st(k).state]||'#8e8e93');

        ft('Music','Now playing from Spotify or Chrome, previous / play-pause / next, volume.')+

  function render(){
    const s=db.settings,t=s.theme||'dark';
    root.dataset.theme=t==='dark'||(t==='auto'&&mq.matches)?'dark':'light';
    root.style.setProperty('--on',s.accent||'#0a84ff');
    $('#nav').innerHTML='<h1>Settings</h1>'+Object.keys(TABS).map(k=>`<button data-tab="${k}" class="${k===tab?'on':''}">${TABS[k]}</button>`).join('');
    $('#main').innerHTML=views[tab](s);
    if(tab==='tools'&&!window.__tl){window.__tl=1;loadToolsInfo()}
    if(tab==='tasks')$('#newtask').focus();
  }
  mq.addEventListener('change',render);
  function loadToolsInfo(){
    if(ocrLangs===null){ocrLangs=[];island.tools.ocr.langs().then(r=>{ocrLangs=(r&&r.langs)||[];if(tab==='tools'&&!typing())render()}).catch(()=>{})}
    island.tools.expander.status().then(r=>{expSt=r||{};if(tab==='tools'&&!typing())render()}).catch(()=>{})}
  const typing=()=>{const a=document.activeElement;return !!(a&&a.matches&&a.matches('#gmUser,#gmPass,#key-claude,#key-openai,#vpUnlock,#vpOld,#vpNew,#vpNew2,#vpRm'))};
  async function refreshAI(){
    try{aiSt=await island.ai.status()}catch(e){aiSt=null}
    ['claude','openai'].forEach(p=>{
      if(aiSt&&aiSt[p])island.ai.models(p).then(m=>{aiModels[p]=m||[];if(tab==='ai'&&!typing())render()});
      else aiModels[p]=[]});
    if(tab==='ai'&&!typing())render()}
  async function refreshVault(){try{vSt=await island.vault.status()}catch(e){vSt=null}if((tab==='security'||tab==='ai')&&!typing())render()}
  island.onVault(st=>{vSt=st;refreshAI();if((tab==='security'||tab==='ai')&&!typing())render()});
  refreshVault();refreshAI();
  island.onStore(d=>{db=d;if(!typing())render()});
  island.onExpander&&island.onExpander(st=>{expSt={...expSt,...st};if(tab==='tools'&&!typing())render()});
  island.app.info().then(i=>{if(i){APPVER=i.version;if(tab==='about')render()}}).catch(()=>{});
  island.getData().then(d=>{db=d;render()});
  island.mail.state().then(m=>{if(m){mail=m;if(tab==='messages'&&!typing())render()}});
  island.onMail(m=>{mail=m;if(tab!=='messages')return;
    ['outlook','gmail','whatsapp'].forEach(k=>{const el=document.querySelector('[data-mstat="'+k+'"]');
      if(el){const s=m.status[k]||{state:'off',detail:'Off'};el.innerHTML='<span style="color:'+({ok:'#30d158',warn:'#ff9f0a',error:'#ff453a'}[s.state]||'#8e8e93')+'">●</span> '+esc(s.detail)}})});
  addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(h in TABS){tab=h;render()}});

  const sset=p=>island.setSettings(p),data=p=>island.setData(p);
  const COMMON=['password','password1','passw0rd','1234567890','12345678910','qwertyuiop','1q2w3e4r5t','iloveyou123','letmein1234','administrator','welcome1234','0123456789'];
  function passMsg(p){p=String(p||'');   // same rules as vault.js, which enforces them
    if(p.length<10)return 'Use at least 10 characters.';
    if(COMMON.includes(p.toLowerCase()))return 'That passphrase is too common.';
    if(/^(.)\1+$/.test(p))return 'Do not repeat one character.';
    const c=[/[a-z]/,/[A-Z]/,/\d/,/[^A-Za-z0-9]/].filter(r=>r.test(p)).length;
    if(p.length<16&&c<3)return 'Mix upper and lower case letters, numbers or symbols, or make it 16+ characters (a few words works well).';
    return ''}
  document.addEventListener('input',e=>{if(e.target.id==='vpNew'){const h=$('#vpHint'),m=passMsg(e.target.value);
    if(h){h.style.color=e.target.value?(m?'#ff9f0a':'#30d158'):'var(--dim)';h.textContent=e.target.value?(m||'Strong enough.'):'A few random words make a strong passphrase.'}}});
  let dragId=null;   // drag and drop reordering of the Menus list
  document.addEventListener('dragstart',e=>{const r=e.target.closest&&e.target.closest('[data-mrow]');if(!r)return;dragId=r.dataset.mrow;r.classList.add('drag');e.dataTransfer.effectAllowed='move';try{e.dataTransfer.setData('text/plain',dragId)}catch(_){}});
  document.addEventListener('dragover',e=>{const r=e.target.closest&&e.target.closest('[data-mrow]');if(!r||!dragId)return;e.preventDefault();document.querySelectorAll('.mrow.over').forEach(x=>x.classList.remove('over'));if(r.dataset.mrow!==dragId)r.classList.add('over')});
  document.addEventListener('dragend',()=>{dragId=null;document.querySelectorAll('.mrow').forEach(x=>x.classList.remove('drag','over'))});
  document.addEventListener('drop',e=>{const r=e.target.closest&&e.target.closest('[data-mrow]');if(!r||!dragId)return;e.preventDefault();
    const o=slOrder(db.settings).map(x=>x[0]),from=o.indexOf(dragId),to=o.indexOf(r.dataset.mrow);dragId=null;
    if(from>=0&&to>=0&&from!==to){o.splice(to,0,o.splice(from,1)[0]);sset({slideOrder:o})}});
  document.addEventListener('change',e=>{const t=e.target;
    if(t.dataset.menu){const h=(db.settings.hiddenSlides||[]).filter(x=>x!==t.dataset.menu);if(!t.checked)h.push(t.dataset.menu);sset({hiddenSlides:h});return}
    if(t.dataset.time){const a=(t.value||'').split(':').map(Number);if(a.length===2&&!a.some(isNaN))sset({[t.dataset.time]:a[0]*60+a[1]});return}
    const k=t.dataset.set;if(!k)return;
    sset({[k]:t.type==='checkbox'?t.checked:t.value.trim?t.value.trim():t.value})});
  document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='newtask')act('addtask');
    if(e.key==='Enter'&&/^key-(claude|openai)$/.test(e.target.id))act('aiconnect',e.target.id.slice(4));
    if(e.key==='Enter'&&e.target.id==='vpUnlock')act('vpunlock')});
  document.addEventListener('click',e=>{
    const n=e.target.closest('[data-tab]');if(n){tab=n.dataset.tab;render();return}
    const b=e.target.closest('[data-click]');if(b)act(b.dataset.click,b.dataset.id)});
  function act(a,id){
    if(a==='quit')island.action('quit');
    else if(a==='clipclear'){island.tools.clip.clear(false).then(()=>{toolsMsg='Clipboard history cleared.';render();setTimeout(()=>{toolsMsg='';if(tab==='tools')render()},3000)})}
    else if(a==='locdetect'){locMsg={ok:false,t:'Detecting…'};render();island.locationDetect().then(r=>{
      if(r&&r.ok){locMsg={ok:true,t:'Detected: '+[r.city,r.region,r.country].filter(Boolean).join(', ')};sset({weatherCity:r.city})}else{locMsg={ok:false,t:(r&&r.text)||'Could not detect your location.'};render()}})}
    else if(a==='locclear'){locMsg=null;sset({weatherCity:''})}
    else if(a==='menuorder')sset({slideOrder:[]});
    else if(a==='menuup'||a==='menudown'){const o=slOrder(db.settings).map(x=>x[0]),i=o.indexOf(id),j=i+(a==='menuup'?-1:1);if(i>=0&&j>=0&&j<o.length){[o[i],o[j]]=[o[j],o[i]];sset({slideOrder:o})}}
    else if(a==='menuall')sset({hiddenSlides:[]});
    else if(a==='menunone')sset({hiddenSlides:SLIDES.map(x=>x[0])});
    else if(a==='resetmodel')sset({model:'llama3.2:1b'});
    else if(a==='openconv')island.openConv(id);
    else if(a==='memdel')data({memory:(db.memory||[]).filter(m=>m.id!==id)});
    else if(a==='memclear'){if(confirm('Forget everything the assistant remembers about you?'))data({memory:[]})}
    else if(a==='memadd'){const i=$('#memNew');if(!i||!i.value.trim())return;island.assist.remember(i.value).then(r=>{if(r.ok)render();else{const m=$('#memMsg');if(m){m.style.color='#ff9f0a';m.textContent=r.text}}})}
    else if(a==='mtdel'){if(confirm('Delete these meeting notes?'))data({meetings:(db.meetings||[]).filter(m=>m.id!==id)})}
    else if(a==='mtexport')island.assist.meetingExport(id);
    else if(a==='mttasks')island.assist.meetingTasks(id).then(r=>alert(r.text));
    else if(a==='delconv')data({conversations:db.conversations.filter(c=>c.id!==id)});
    else if(a==='clearconv'){if(confirm('Delete all saved chats?'))data({conversations:[]})}
    else if(a==='addtask'){const v=$('#newtask').value.trim();if(v)data({tasks:[{id:String(Date.now()),text:v,done:false},...db.tasks]})}
    else if(a==='toggle')data({tasks:db.tasks.map(t=>t.id===id?{...t,done:!t.done}:t)});
    else if(a==='deltask')data({tasks:db.tasks.filter(t=>t.id!==id)});
    else if(a==='cleardone')data({tasks:db.tasks.filter(t=>!t.done)});
    else if(a==='gmconnect'){const m=$('#gmMsg'),u=$('#gmUser').value,p=$('#gmPass').value;m.textContent='Checking…';
      island.mail.setGmail(u,p).then(r=>{if(r.ok)render();else{const mm=$('#gmMsg');if(mm){mm.style.color='#ff453a';mm.textContent=r.text}}})}
    else if(a==='gmclear')island.mail.clearGmail().then(ok=>{if(ok)render();else{const mm=$('#gmMsg');if(mm){mm.style.color='#ff453a';mm.textContent='Unlock your keys in Security first, so the saved password can be deleted.'}}});
    else if(a==='walink')island.mail.linkWhatsApp();
    else if(a==='vpunlock'){const i=$('#vpUnlock');if(!i||!i.value)return;vMsg={ok:true,t:'Checking…'};$('#vmsg').textContent='Checking…';
      island.vault.unlock(i.value).then(r=>{i.value='';vSt=r.status;vMsg=r.ok?null:{ok:false,t:r.text};refreshAI();render()})}
    else if(a==='vplock'){island.vault.lock().then(st=>{vSt=st;vMsg=null;refreshAI();render()})}
    else if(a==='vpset'){const n=$('#vpNew').value,n2=$('#vpNew2').value,o=$('#vpOld');
      if(n!==n2){vMsg={ok:false,t:'The two passphrases do not match.'};render();return}
      const hint=passMsg(n);if(hint){vMsg={ok:false,t:hint};render();return}
      vMsg={ok:true,t:'Encrypting…'};$('#vmsg').textContent='Encrypting…';
      island.vault.setPassphrase(n,o?o.value:'').then(r=>{vSt=r.status;vMsg={ok:r.ok,t:r.text};refreshAI();render()})}
    else if(a==='vprm'){const i=$('#vpRm');if(!i||!i.value)return;
      island.vault.removePassphrase(i.value).then(r=>{vSt=r.status;vMsg={ok:r.ok,t:r.text};refreshAI();render()})}
    else if(a==='vpwipe'){const b=$('#vpwipe');
      if(b.dataset.armed){island.vault.wipe().then(st=>{vSt=st;vMsg={ok:true,t:'All saved keys were erased.'};aiMsg={};refreshAI();render()})}
      else{b.dataset.armed='1';b.textContent='Click again to erase';setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Erase all keys'}},4000)}}
    else if(a==='aikey')island.openUrl(id==='claude'?'https://console.anthropic.com/settings/keys':'https://platform.openai.com/api-keys');
    else if(a==='aiuse')sset({aiProvider:id});
    else if(a==='aiconnect'){const inp=$('#key-'+id),m=$('#aimsg-'+id);if(!inp||!m)return;
      m.style.color='var(--dim)';m.textContent='Checking the key…';
      island.ai.connect(id,inp.value).then(async r=>{
        if(r.ok){aiModels[id]=r.models||[];const auto=!db.settings.aiProvider||db.settings.aiProvider==='ollama';
          aiMsg[id]={ok:true,t:auto?'Connected. Chat now uses '+(id==='claude'?'Claude':'ChatGPT')+'. You can switch back above.':'Connected.'};
          if(auto)await sset({aiProvider:id});
          await refreshAI()}
        else{m.style.color='#ff453a';m.textContent=r.text||'Could not connect.'}})}
    else if(a==='aidisc'){island.ai.disconnect(id).then(()=>{aiMsg[id]=null;aiModels[id]=[];refreshAI()})}
  }
})();
</script>
</body>
</html>
