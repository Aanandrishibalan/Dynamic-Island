name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # the unit and integration tests are plain Node with fakes: no npm install, no Windows needed
      - name: Run tests
        working-directory: dynamic-island
        run: npm test
