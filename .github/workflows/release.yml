name: Release

# Push a tag such as v1.4.1 and this builds the Windows installer + portable exe
# and attaches them to a GitHub Release. See docs/RELEASING.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dynamic-island/package-lock.json

      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        working-directory: dynamic-island
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version $pkg"; exit 1
          fi

      - name: Install
        working-directory: dynamic-island
        run: npm ci

      - name: Test
        working-directory: dynamic-island
        run: npm test

      - name: Build installer and portable exe
        working-directory: dynamic-island
        run: npm run dist -- --publish never

      - name: Keep the build as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            dynamic-island/dist/*.exe
          if-no-files-found: error

      - name: Publish the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dynamic-island/dist/*.exe
          generate_release_notes: true
          fail_on_unmatched_files: true
